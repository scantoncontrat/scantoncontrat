<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin — Scan Ton Contrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
  /* LOGIN */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f1f4a}
  .login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-logo{font-size:22px;font-weight:800;color:#0f1f4a;margin-bottom:8px}
  .login-logo span{color:#10b981}
  .login-sub{color:#64748b;font-size:13px;margin-bottom:28px}
  .login-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block}
  .login-input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
  .login-input:focus{border-color:#10b981}
  .login-btn{width:100%;margin-top:20px;padding:13px;background:#10b981;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .login-btn:hover{opacity:.9}
  .login-err{color:#ef4444;font-size:13px;margin-top:10px;display:none}
  /* DASHBOARD */
  #dashboard{display:none}
  .topbar{background:#0f1f4a;color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
  .topbar-logo{font-size:18px;font-weight:800}
  .topbar-logo span{color:#10b981}
  .topbar-right{display:flex;align-items:center;gap:16px}
  .badge-live{background:#10b981;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .logout-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
  .main{padding:28px}
  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
  .stat-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0}
  .stat-label{font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .stat-val{font-size:32px;font-weight:800;color:#0f1f4a}
  .stat-sub{font-size:12px;color:#64748b;margin-top:4px}
  /* TABS */
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#e2e8f0;padding:4px;border-radius:10px;width:fit-content}
  .tab{padding:8px 18px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#64748b;transition:all .15s}
  .tab.active{background:#fff;color:#0f1f4a;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  /* TABLE */
  .table-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
  .table-head{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
  .table-title{font-weight:700;color:#0f1f4a}
  .table-count{font-size:12px;color:#64748b}
  table{width:100%;border-collapse:collapse}
  th{padding:11px 16px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
  td{padding:12px 16px;border-bottom:1px solid #f1f5f9;font-size:13px;color:#374151}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f8fafc}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-new{background:#dbeafe;color:#1d4ed8}
  .badge-done{background:#d1fae5;color:#065f46}
  .badge-hot{background:#fee2e2;color:#991b1b}
  .score-bar{display:flex;align-items:center;gap:8px}
  .score-track{height:6px;width:60px;background:#e2e8f0;border-radius:3px;overflow:hidden}
  .score-fill{height:100%;border-radius:3px;background:#10b981}
  .score-fill.red{background:#ef4444}
  .score-fill.yellow{background:#f59e0b}
  .empty{text-align:center;padding:48px;color:#94a3b8}
  .refresh-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#374151;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600}
  .refresh-btn:hover{background:#e2e8f0}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">Scan Ton <span>Contrat</span></div>
    <div class="login-sub">Dashboard administrateur</div>
    <label class="login-label">Token d'accès</label>
    <input class="login-input" type="password" id="token-input" placeholder="stc_admin_..." onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Accéder →</button>
    <div class="login-err" id="login-err">Token incorrect ou erreur serveur.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">Scan Ton <span>Contrat</span> — Admin</div>
    <div class="topbar-right">
      <span class="badge-live">● LIVE</span>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Analyses totales</div>
        <div class="stat-val" id="stat-analyses">—</div>
        <div class="stat-sub">depuis le lancement</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Leads collectés</div>
        <div class="stat-val" id="stat-leads">—</div>
        <div class="stat-sub">emails & téléphones</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Économie moyenne</div>
        <div class="stat-val" id="stat-eco">—</div>
        <div class="stat-sub">€/mois estimés</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Taux de lead</div>
        <div class="stat-val" id="stat-taux">—</div>
        <div class="stat-sub">analyses → contact</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showTab('leads',this)">Leads clients</button>
      <button class="tab" onclick="showTab('analyses',this)">Analyses</button>
    </div>

    <!-- LEADS TABLE -->
    <div id="tab-leads" class="table-card">
      <div class="table-head">
        <div class="table-title">Leads clients</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="table-count" id="leads-count"></span>
          <button class="refresh-btn" onclick="loadData()">↺ Rafraîchir</button>
        </div>
      </div>
      <div id="leads-body"></div>
    </div>

    <!-- ANALYSES TABLE -->
    <div id="tab-analyses" class="table-card" style="display:none">
      <div class="table-head">
        <div class="table-title">Analyses de contrats</div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="table-count" id="analyses-count"></span>
          <button class="refresh-btn" onclick="loadData()">↺ Rafraîchir</button>
        </div>
      </div>
      <div id="analyses-body"></div>
    </div>
  </div>
</div>

<script>
let adminToken = sessionStorage.getItem('admin_token') || ''

function doLogin() {
  const t = document.getElementById('token-input').value.trim()
  if (!t) return
  adminToken = t
  loadData()
}

function doLogout() {
  sessionStorage.removeItem('admin_token')
  adminToken = ''
  document.getElementById('dashboard').style.display = 'none'
  document.getElementById('login').style.display = 'flex'
  document.getElementById('token-input').value = ''
}

function showTab(tab, el) {
  document.getElementById('tab-leads').style.display = tab === 'leads' ? 'block' : 'none'
  document.getElementById('tab-analyses').style.display = tab === 'analyses' ? 'block' : 'none'
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'))
  el.classList.add('active')
}

async function loadData() {
  document.getElementById('login-err').style.display = 'none'
  try {
    const res = await fetch('/api/admin/leads?token=' + encodeURIComponent(adminToken))
    if (res.status === 401) {
      document.getElementById('login-err').style.display = 'block'
      return
    }
    const data = await res.json()
    sessionStorage.setItem('admin_token', adminToken)
    document.getElementById('login').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    renderStats(data.stats, data.analyses, data.clients)
    renderLeads(data.clients || [])
    renderAnalyses(data.analyses || [])
  } catch (e) {
    document.getElementById('login-err').style.display = 'block'
    document.getElementById('login-err').textContent = 'Erreur réseau : ' + e.message
  }
}

function renderStats(stats, analyses, clients) {
  document.getElementById('stat-analyses').textContent = stats.total_analyses
  document.getElementById('stat-leads').textContent = stats.total_leads
  document.getElementById('stat-eco').textContent = stats.economie_moyenne ? stats.economie_moyenne + '€' : '—'
  const taux = stats.total_analyses > 0 ? Math.round(stats.total_leads / stats.total_analyses * 100) : 0
  document.getElementById('stat-taux').textContent = taux + '%'
}

function renderLeads(clients) {
  document.getElementById('leads-count').textContent = clients.length + ' leads'
  if (!clients.length) {
    document.getElementById('leads-body').innerHTML = '<div class="empty">Aucun lead pour l\'instant</div>'
    return
  }
  document.getElementById('leads-body').innerHTML = `
    <table>
      <thead><tr>
        <th>Prénom</th><th>Email</th><th>Téléphone</th><th>Statut</th><th>Date</th>
      </tr></thead>
      <tbody>${clients.map(c => `
        <tr>
          <td><strong>${c.prenom || '—'}</strong></td>
          <td><a href="mailto:${c.email}" style="color:#10b981">${c.email || '—'}</a></td>
          <td>${c.telephone || '—'}</td>
          <td><span class="badge ${c.statut === 'actif' ? 'badge-done' : 'badge-new'}">${c.statut || 'nouveau'}</span></td>
          <td>${c.created_at ? new Date(c.created_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`
}

function renderAnalyses(analyses) {
  document.getElementById('analyses-count').textContent = analyses.length + ' analyses'
  if (!analyses.length) {
    document.getElementById('analyses-body').innerHTML = '<div class="empty">Aucune analyse pour l\'instant</div>'
    return
  }
  document.getElementById('analyses-body').innerHTML = `
    <table>
      <thead><tr>
        <th>Type</th><th>Assureur</th><th>Cotisation</th><th>Économie</th><th>Score</th><th>Date</th>
      </tr></thead>
      <tbody>${analyses.map(a => {
        const score = a.score_qualite || 0
        const colorClass = score >= 7 ? 'red' : score >= 5 ? 'yellow' : ''
        return `<tr>
          <td><strong>${a.type_contrat || '—'}</strong></td>
          <td>${a.assureur_actuel || '—'}</td>
          <td>${a.cotisation_mensuelle ? a.cotisation_mensuelle + ' €/mois' : '—'}</td>
          <td style="color:#10b981;font-weight:700">${a.economie_estimee_mensuelle ? '+' + a.economie_estimee_mensuelle + ' €/mois' : '—'}</td>
          <td><div class="score-bar"><div class="score-track"><div class="score-fill ${colorClass}" style="width:${score*10}%"></div></div><span>${score}/10</span></div></td>
          <td>${a.analyse_le ? new Date(a.analyse_le).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—'}</td>
        </tr>`}).join('')}
      </tbody>
    </table>`
}

// Auto-login si token en session
if (adminToken) loadData()
</script>
</body>
</html>
